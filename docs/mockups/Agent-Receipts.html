<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposal: cards that show their working</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"EB Garamond",Georgia,serif;background:#F6F1E7}
a{color:#7A2E2E}a:hover{color:#5A1F1F}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F1E7; color: #2A2320; display: flex; flex-direction: column; font-family: 'EB Garamond', Georgia, serif; overflow: hidden;">

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px 14px 18px; border-bottom: 1px solid #E3DAC8;">
<div style="width: 36px; height: 36px; border-radius: 50%; background: #7A2E2E; color: #F6F1E7; display: grid; place-items: center; font-style: italic; font-size: 19px; flex: none;">M</div>
<div style="flex-grow: 1; font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600;">Ask a bookseller</div>
<button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: #6B5F55;"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14"></path></svg></button>
</div>

<button style="font: inherit; display: flex; align-items: center; gap: 8px; padding: 10px 18px; min-height: 44px; background: #EFE7D8; border: 0; border-bottom: 1px solid #E3DAC8; color: #2A2320; text-align: left;">
<span style="font-size: 14px; color: #6B5F55; flex: none;">For dad:</span>
<span style="flex-grow: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">history, gripping, not gory, under 400 pp</span>
<span style="font-size: 15px; color: #7A2E2E; font-weight: 600; flex: none;">Edit</span>
</button>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 8px; overflow: hidden;">
<div style="display: flex; gap: 10px; font-size: 17px; line-height: 1.4;">
<div style="width: 24px; height: 24px; border-radius: 50%; background: #E9D9D4; color: #7A2E2E; display: grid; place-items: center; font-style: italic; font-size: 13px; flex: none; margin-top: 2px;">M</div>
<div>Three I'd happily put in his hands. Each one ticks every box:</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #EFE7D8; border: 1px solid #E0D6C3; border-radius: 16px;">
<div style="display: flex; gap: 12px;">
<div style="width: 60px; height: 88px; background: #7A2E2E; border-radius: 3px; flex: none; box-shadow: 2px 2px 0 #D8CBB4;"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<div style="font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.2;">Fire &amp; Salt</div>
<div style="font-size: 15px; color: #6B5F55;">Idris Maddox</div>
<div style="font-size: 16px; line-height: 1.35; margin-top: 4px;">All the tension of crime, rooted in real history.</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; padding: 3px 9px; border-radius: 999px; background: #F6F1E7; border: 1px solid #DCCFB8;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3C6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.5 2.3L10 3.5"></path></svg>392 pages</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; padding: 3px 9px; border-radius: 999px; background: #F6F1E7; border: 1px solid #DCCFB8;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3C6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.5 2.3L10 3.5"></path></svg>Not gory</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; padding: 3px 9px; border-radius: 999px; background: #F6F1E7; border: 1px solid #DCCFB8;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3C6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.5 2.3L10 3.5"></path></svg>History</span>
</div>
<div style="display: flex; align-items: center; gap: 10px;">
<div style="font-size: 18px; font-weight: 600; flex-grow: 1;">€16.99</div>
<button style="font: inherit; font-size: 16px; padding: 0 14px; min-height: 44px; background: transparent; border: 1px solid #CDBFA6; border-radius: 999px; color: #7A2E2E;">Details</button>
<button style="font: inherit; font-size: 16px; font-weight: 600; padding: 0 16px; min-height: 44px; background: #7A2E2E; border: 0; border-radius: 999px; color: #F6F1E7;">Add</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #EFE7D8; border: 1px solid #E0D6C3; border-radius: 16px;">
<div style="display: flex; gap: 12px;">
<div style="width: 60px; height: 88px; background: #E3D6B8; border-radius: 3px; flex: none; box-shadow: 2px 2px 0 #D8CBB4;"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<div style="font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.2;">The Cartographer's War</div>
<div style="font-size: 15px; color: #6B5F55;">Edmund Hale</div>
<div style="font-size: 16px; line-height: 1.35; margin-top: 4px;">True story, told like a thriller.</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; padding: 3px 9px; border-radius: 999px; background: #F6F1E7; border: 1px solid #DCCFB8;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3C6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.5 2.3L10 3.5"></path></svg>336 pages</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; padding: 3px 9px; border-radius: 999px; background: #F6F1E7; border: 1px solid #DCCFB8;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3C6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.5 2.3L10 3.5"></path></svg>Not gory</span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; padding: 3px 9px; border-radius: 999px; background: #F6F1E7; border: 1px solid #DCCFB8;"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3C6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.5 2.3L10 3.5"></path></svg>History</span>
</div>
</div>
</div>

<div style="display: flex; gap: 8px; padding: 10px 18px; border-top: 1px solid #E3DAC8; overflow: hidden; white-space: nowrap;">
<button style="font: inherit; font-size: 15px; padding: 0 14px; min-height: 40px; background: transparent; border: 1px solid #CDBFA6; border-radius: 999px; color: #7A2E2E; flex: none;">Compare the first two</button>
<button style="font: inherit; font-size: 15px; padding: 0 14px; min-height: 40px; background: transparent; border: 1px solid #CDBFA6; border-radius: 999px; color: #7A2E2E; flex: none;">Something shorter</button>
<button style="font: inherit; font-size: 15px; padding: 0 14px; min-height: 40px; background: transparent; border: 1px solid #CDBFA6; border-radius: 999px; color: #7A2E2E; flex: none;">Gift ideas</button>
</div>
<div style="display: flex; gap: 8px; padding: 4px 18px 18px;">
<label for="r-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Message</label>
<input id="r-msg" placeholder="Reply or ask something else…" style="font: inherit; font-size: 16px; flex-grow: 1; min-height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid #DCCFB8; background: #EFE7D8; color: #2A2320;">
<button aria-label="Send" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #CDBFA6; background: transparent; color: #7A2E2E; display: grid; place-items: center; flex: none;"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h12M10 4l5 5-5 5"></path></svg></button>
</div>

</div>
</body>
</html>
